services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ticketbot
      POSTGRES_PASSWORD: ticketbot
      POSTGRES_DB: ticketbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
